<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Analytics Agent</title>
  <style>
    :root {
      --g:      #76b900;
      --g-dim:  rgba(118, 185, 0, 0.22);
      --g-glow: rgba(118, 185, 0, 0.10);
      --panel:  rgba(2, 7, 2, 0.86);
      --text:   #ddeedd;
      --muted:  #4a5e4a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); height: 100vh; overflow: hidden; background: #020702; }

    /* ── Background ── */
    #videoBg {
      position: fixed; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      z-index: 0; display: none;
    }
    #videoBg.active { display: block; }
    #videoPlaceholder {
      position: fixed; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #1a2a1a;
    }

    /* ── LIVE badge ── */
    #liveBadge {
      position: fixed; top: 18px; left: 18px; z-index: 20;
      display: none; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.72); border: 1px solid rgba(220,40,20,0.55);
      padding: 4px 10px 4px 8px; border-radius: 2px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.18em; color: #ff3a22;
    }
    #liveBadge.on { display: flex; }
    #liveBadge .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3a22; animation: blink-dot 1s step-end infinite; }
    @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Side panel ── */
    .side { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 390px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }

    /* ── NV panel base ── */
    .nv {
      background: var(--panel);
      border: 1px solid var(--g-dim);
      border-radius: 3px;
      backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      box-shadow: 0 0 28px var(--g-glow), inset 0 1px 0 rgba(118,185,0,0.07);
      position: relative; overflow: hidden;
    }
    /* thin green top-edge accent */
    .nv::after {
      content: '';
      position: absolute; top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--g), transparent);
      opacity: 0.55;
      pointer-events: none;
    }

    /* ── Panel header row ── */
    .ph {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 13px 8px;
      border-bottom: 1px solid rgba(118,185,0,0.09);
    }
    .ph-label {
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--g); flex: 1;
    }

    /* ── Status badge ── */
    .sb { display: flex; align-items: center; gap: 5px; }
    .sb-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); transition: background 0.3s; flex-shrink: 0; }
    .sb-text { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); transition: color 0.3s; }
    .sb.analyzing .sb-dot { background: #e8a000; animation: pulse 0.9s ease-in-out infinite; }
    .sb.analyzing .sb-text { color: #e8a000; }
    .sb.done .sb-dot { background: var(--g); animation: none; }
    .sb.done .sb-text { color: var(--g); }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.25;transform:scale(0.6)} }

    .time-chip { font-size: 9px; font-family: Consolas, monospace; color: var(--muted); letter-spacing: 0.05em; }

    /* ── Query input ── */
    .query-body { display: flex; align-items: flex-end; gap: 7px; padding: 9px 12px; }
    .q-prefix { color: var(--g); font-family: Consolas, monospace; font-size: 14px; flex-shrink: 0; line-height: 1.4; }
    #promptText {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 13px; resize: none;
      height: 21px; max-height: 96px; overflow-y: hidden; line-height: 1.55;
      caret-color: var(--g); font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #promptText::placeholder { color: #243324; }
    .btn-submit {
      background: var(--g); border: none; border-radius: 2px;
      color: #000; width: 30px; height: 30px;
      cursor: pointer; font-size: 13px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.14s;
    }
    .btn-submit:hover { background: #8fd200; }

    /* ── Response body ── */
    .res-body {
      overflow: hidden; max-height: 0;
      padding: 0 13px;
      transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                  padding 0.32s ease;
    }
    .res-body.open { max-height: 58vh; overflow-y: auto; padding: 10px 13px 14px; }
    .res-text {
      display: block; font-size: 13px; line-height: 1.74;
      color: #c8ddc8; white-space: pre-wrap; word-break: break-word;
    }
    .res-text.typing::after {
      content: '▮'; color: var(--g);
      animation: cur 0.7s step-end infinite; font-size: 11px;
    }
    @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Controls ── */
    .ctrl {
      flex-shrink: 0; margin-top: auto;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
    }
    #statusText { flex: 1; font-size: 10px; font-family: Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.04em; }
    .btn-c {
      padding: 6px 15px; border: none; border-radius: 2px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.14s, background 0.14s;
    }
    .btn-c:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn-start { background: var(--g); color: #000; }
    .btn-start:hover:not(:disabled) { background: #8fd200; }
    .btn-stop  { background: rgba(190,28,0,0.8); color: #fff; }
    .btn-stop:hover:not(:disabled)  { background: rgba(220,38,0,0.9); }
    .btn-cfg {
      background: rgba(118,185,0,0.08); border: 1px solid var(--g-dim);
      border-radius: 2px; color: var(--g);
      width: 30px; height: 30px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.14s;
    }
    .btn-cfg:hover { background: rgba(118,185,0,0.18); }

    /* ── Settings Modal ── */
    .modal-bg {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.68);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #010601; border: 1px solid var(--g-dim);
      border-radius: 3px; width: 420px; max-height: 84vh; overflow-y: auto; padding: 20px;
      box-shadow: 0 0 40px rgba(118,185,0,0.14);
      animation: mIn 0.18s ease;
    }
    @keyframes mIn { from{opacity:0;transform:scale(0.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .m-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(118,185,0,0.13); }
    .m-title { color: var(--g); font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .m-close { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; line-height: 1; transition: color 0.14s; }
    .m-close:hover { color: var(--text); }
    .m-sec { margin-bottom: 18px; }
    .m-sec-title { color: var(--g); font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; padding-bottom: 5px; border-bottom: 1px solid rgba(118,185,0,0.1); margin-bottom: 10px; }
    .field { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .field label { color: var(--muted); font-size: 11px; width: 78px; flex-shrink: 0; }
    .field input {
      flex: 1; min-width: 0;
      background: rgba(118,185,0,0.04); border: 1px solid rgba(118,185,0,0.14); border-radius: 2px;
      color: var(--text); font-family: Consolas, monospace; font-size: 12px;
      padding: 5px 9px; outline: none; transition: border-color 0.14s;
    }
    .field input:focus { border-color: rgba(118,185,0,0.48); }
    .rtsp-box {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(118,185,0,0.09); border-radius: 2px;
      padding: 5px 9px; font-family: Consolas, monospace; font-size: 11px;
      color: var(--g); word-break: break-all; margin-top: 3px;
    }
    .m-textarea {
      width: 100%; background: rgba(118,185,0,0.04); border: 1px solid rgba(118,185,0,0.14); border-radius: 2px;
      color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
      padding: 9px; resize: vertical; height: 76px; outline: none; transition: border-color 0.14s; caret-color: var(--g);
    }
    .m-textarea:focus { border-color: rgba(118,185,0,0.48); }
    .btn-apply {
      display: block; width: 100%; margin-top: 8px; padding: 8px;
      background: var(--g); border: none; border-radius: 2px;
      color: #000; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; transition: background 0.14s;
    }
    .btn-apply:hover { background: #8fd200; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(118,185,0,0.22); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(118,185,0,0.42); }
  </style>
</head>
<body>

<img id="videoBg" src="" alt="">
<div id="videoPlaceholder">카메라 연결 대기 중...</div>

<div id="liveBadge"><div class="dot"></div>LIVE</div>

<!-- ── Side panel ── -->
<div class="side">

  <!-- Query -->
  <div class="nv">
    <div class="ph">
      <span class="ph-label">분석 쿼리</span>
    </div>
    <div class="query-body">
      <span class="q-prefix">›</span>
      <textarea id="promptText" placeholder="질문을 입력하세요…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();applyPrompt();}"
      >{{ settings.prompt }}</textarea>
      <button class="btn-submit" onclick="applyPrompt()" title="적용">↵</button>
    </div>
  </div>

  <!-- Response -->
  <div class="nv">
    <div class="ph">
      <span class="ph-label">에이전트 응답</span>
      <span class="time-chip" id="timeChip"></span>
      <div class="sb" id="sb"><div class="sb-dot"></div><span class="sb-text">대기</span></div>
    </div>
    <div class="res-body" id="resBody">
      <span class="res-text" id="resText"></span>
    </div>
  </div>

  <!-- Controls -->
  <div class="nv ctrl">
    <span id="statusText">● 대기 중</span>
    <button class="btn-c btn-start" id="startBtn" onclick="startStream()">START</button>
    <button class="btn-c btn-stop"  id="stopBtn"  onclick="stopStream()" disabled>STOP</button>
    <button class="btn-cfg" onclick="openCfg()" title="설정">⚙</button>
  </div>

</div>

<!-- ── Settings modal ── -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeCfg()">
  <div class="modal">
    <div class="m-head">
      <span class="m-title">시스템 설정</span>
      <button class="m-close" onclick="closeCfg()">✕</button>
    </div>

    <div class="m-sec">
      <div class="m-sec-title">카메라 접속 정보</div>
      <div class="field"><label>카메라 IP</label>   <input id="camIp"   value="{{ settings.cam_ip }}"></div>
      <div class="field"><label>포트</label>         <input id="camPort" value="{{ settings.cam_port }}"></div>
      <div class="field"><label>사용자명</label>     <input id="camUser" value="{{ settings.cam_user }}"></div>
      <div class="field"><label>비밀번호</label>     <input id="camPw"   type="password" value="{{ settings.cam_pw }}"></div>
      <div class="field"><label>스트림 경로</label>  <input id="camPath" value="{{ settings.cam_path }}"></div>
      <div style="font-size:8px;color:var(--muted);margin:6px 0 3px;letter-spacing:.14em;text-transform:uppercase;">RTSP URL</div>
      <div class="rtsp-box" id="rtspPreview"></div>
    </div>

    <div class="m-sec">
      <div class="m-sec-title">vLLM 서버</div>
      <div class="field"><label>서버 URL</label>  <input id="vllmUrl"   value="{{ settings.vllm_url }}"></div>
      <div class="field"><label>모델명</label>     <input id="modelName" value="{{ settings.model_name }}"></div>
      <div class="field"><label>API 키</label>     <input id="apiKey"    value="{{ settings.api_key }}"></div>
    </div>

    <div class="m-sec">
      <div class="m-sec-title">기본 분석 프롬프트</div>
      <textarea class="m-textarea" id="promptModal">{{ settings.prompt }}</textarea>
      <button class="btn-apply" onclick="applyFromModal()">적용 후 닫기</button>
    </div>
  </div>
</div>

<script>
  // ── WebSocket ─────────────────────────────────────────────────────────────
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ({ data }) => {
    const d = JSON.parse(data);
    if      (d.type === 'status')       setStatus(d.text);
    else if (d.type === 'result_start') onStart(d.time);
    else if (d.type === 'chunk')        onChunk(d.text);
    else if (d.type === 'result_end')   onEnd();
  };
  ws.onclose = () => setStatus('● 연결 끊김');
  const send = obj => ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify(obj));

  function setStatus(t) { document.getElementById('statusText').textContent = t; }

  // ── Streaming response ────────────────────────────────────────────────────
  const resBody = document.getElementById('resBody');
  const resText = document.getElementById('resText');
  const timeChip = document.getElementById('timeChip');
  const sb = document.getElementById('sb');
  let wasOpen = false;

  function setSb(state) {
    sb.className = 'sb ' + state;
    sb.querySelector('.sb-text').textContent = {analyzing:'분석 중', done:'완료'}[state] ?? '대기';
  }

  function onStart(time) {
    timeChip.textContent = time;
    setSb('analyzing');
    if (wasOpen) {
      resBody.classList.remove('open');
      resText.classList.remove('typing');
      setTimeout(() => { resText.textContent = ''; }, 310);
    } else {
      resText.textContent = '';
    }
    wasOpen = false;
  }

  function onChunk(text) {
    if (!wasOpen) { resBody.classList.add('open'); wasOpen = true; }
    resText.classList.add('typing');
    resText.textContent += text;
    if (resBody.scrollHeight - resBody.scrollTop - resBody.clientHeight < 40)
      resBody.scrollTop = resBody.scrollHeight;
  }

  function onEnd() {
    resText.classList.remove('typing');
    setSb('done');
    clearTimeout(sb._t);
    sb._t = setTimeout(() => setSb(''), 4000);
  }

  // ── RTSP preview ──────────────────────────────────────────────────────────
  function updateRtsp() {
    const u = document.getElementById('camUser').value;
    const ip = document.getElementById('camIp').value;
    const p  = document.getElementById('camPort').value;
    let path = document.getElementById('camPath').value;
    if (path && !path.startsWith('/')) path = '/' + path;
    document.getElementById('rtspPreview').textContent =
      `rtsp://${u ? u+':****@' : ''}${ip}:${p}${path}`;
  }
  ['camIp','camPort','camUser','camPw','camPath'].forEach(id =>
    document.getElementById(id).addEventListener('input', updateRtsp));
  updateRtsp();

  // ── Modal ─────────────────────────────────────────────────────────────────
  const openCfg  = () => document.getElementById('modalBg').classList.add('open');
  const closeCfg = () => document.getElementById('modalBg').classList.remove('open');
  document.addEventListener('keydown', e => e.key === 'Escape' && closeCfg());

  // ── Controls ─────────────────────────────────────────────────────────────
  function applyPrompt() {
    const p = document.getElementById('promptText').value.trim();
    if (!p) return;
    document.getElementById('promptModal').value = p;
    send({ action: 'update_prompt', prompt: p });
  }

  function applyFromModal() {
    const p = document.getElementById('promptModal').value.trim();
    document.getElementById('promptText').value = p;
    autoResize();
    send({ action: 'update_prompt', prompt: p });
    closeCfg();
  }

  function startStream() {
    send({
      action: 'start_stream',
      cam_ip:     document.getElementById('camIp').value,
      cam_port:   document.getElementById('camPort').value,
      cam_user:   document.getElementById('camUser').value,
      cam_pw:     document.getElementById('camPw').value,
      cam_path:   document.getElementById('camPath').value,
      vllm_url:   document.getElementById('vllmUrl').value,
      model_name: document.getElementById('modelName').value,
      api_key:    document.getElementById('apiKey').value,
      prompt:     document.getElementById('promptText').value.trim(),
    });
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled  = false;
    const img = document.getElementById('videoBg');
    img.src = '/video_feed?' + Date.now();
    img.classList.add('active');
    document.getElementById('videoPlaceholder').style.display = 'none';
    document.getElementById('liveBadge').classList.add('on');
  }

  function stopStream() {
    send({ action: 'stop_stream' });
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled  = true;
    const img = document.getElementById('videoBg');
    img.classList.remove('active'); img.src = '';
    document.getElementById('videoPlaceholder').style.display = 'flex';
    document.getElementById('liveBadge').classList.remove('on');
    setSb('');
  }

  function autoResize() {
    const el = document.getElementById('promptText');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 96) + 'px';
  }
  document.getElementById('promptText').addEventListener('input', autoResize);
</script>
</body>
</html>
